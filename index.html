<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#170F24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Chokh Tip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #170F24;
      --plum: #261A3A;
      --plum2: #33254C;
      --cream: #F7F1FF;
      --mute: #A99CC4;
      --lav: #B7A4FF;
      --lavink: #2A1470;
      --lavdeep: #7A63D6;
      --rose: #FF5E8A;
      --roseink: #3A0618;
      --rosedeep: #B8335A;
      --mint: #7CF0C8;
      --mintink: #06382A;
      --sun: #FFD76A;
      --peach: #FFB48A;
      --line: rgba(255, 255, 255, .08);
      --disp: "Bricolage Grotesque", -apple-system, system-ui, sans-serif;
      --body: -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: #0c0716;
      color: var(--cream);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased
    }

    button,
    input {
      font-family: inherit
    }

    button {
      cursor: pointer
    }

    a {
      color: inherit;
      text-decoration: none
    }

    .d {
      font-family: var(--disp);
      letter-spacing: -.025em
    }

    html[lang=bn] {
      --disp: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif;
      --body: "Hind Siliguri", "Noto Sans Bengali", system-ui, sans-serif
    }

    html[lang=bn] .d,
    html[lang=bn] .h1,
    html[lang=bn] .mode .t,
    html[lang=bn] .rw,
    html[lang=bn] .big {
      letter-spacing: 0;
      line-height: 1.25 !important;
      font-weight: 700
    }

    html[lang=bn] .cap,
    html[lang=bn] .chip,
    html[lang=bn] .tab {
      letter-spacing: 0
    }

    html[lang=bn] .hero .big {
      line-height: 1.3 !important
    }

    #app {
      position: relative;
      width: 100%;
      max-width: 460px;
      height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background: radial-gradient(110% 55% at 100% 0%, #3b1f6e, #3b1f6e00 62%), radial-gradient(90% 45% at 0% 100%, #4b1b47, #4b1b4700 60%), var(--ink);
      transition: background .4s
    }

    #app[data-theme=rose] {
      background: radial-gradient(110% 55% at 100% 0%, #5a1b3f, #5a1b3f00 62%), radial-gradient(90% 45% at 0% 100%, #2e1b5c, #2e1b5c00 60%), var(--ink)
    }

    #app[data-theme=kill] {
      background: radial-gradient(90% 50% at 50% 28%, #5a1b3f, #5a1b3f00 70%), var(--ink)
    }

    #app[data-theme=gold] {
      background: radial-gradient(110% 30% at 50% 0%, #5b3a12, #5b3a1200 70%), radial-gradient(110% 40% at 100% 55%, #3b1f6e, #3b1f6e00 62%), radial-gradient(90% 30% at 0% 100%, #4b1b47, #4b1b4700 60%), var(--ink)
    }

    @media(min-width:600px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(60% 60% at 50% 40%, #2a1750, #0c0716)
      }

      #app {
        height: min(100dvh - 40px, 880px);
        border-radius: 44px;
        box-shadow: 0 0 0 10px #05030a, 0 40px 80px #0009
      }
    }

    .screen {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top, 0px) + 30px) 24px calc(env(safe-area-inset-bottom, 0px) + 24px);
      animation: screenin .35s cubic-bezier(.2, .8, .2, 1)
    }

    .screen::-webkit-scrollbar {
      width: 0
    }

    .screen.still {
      animation: none
    }

    .circ.bad {
      background: var(--rose);
      color: var(--roseink);
      border-color: transparent
    }

    .pcell.speaking .av {
      animation: halo 1.4s ease-out infinite
    }

    @keyframes screenin {
      0% {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .grow {
      flex: 1
    }

    .mt-auto {
      margin-top: auto
    }

    .row {
      display: flex;
      align-items: center
    }

    .between {
      justify-content: space-between
    }

    .center {
      text-align: center
    }

    h1 {
      margin: 0
    }

    .h1 {
      font-family: var(--disp);
      letter-spacing: -.025em;
      font-size: 40px;
      line-height: 1;
      font-weight: 800;
      margin: 20px 0 0
    }

    .h-xl {
      font-size: 54px;
      line-height: .95
    }

    .sub {
      margin: 10px 0 0;
      font-size: 16px;
      line-height: 1.38;
      color: var(--mute)
    }

    .cap {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--mute)
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 58px;
      width: 100%;
      border: 0;
      border-radius: 20px;
      font-size: 17px;
      font-weight: 600;
      color: var(--cream);
      background: var(--plum2);
      transition: transform .12s, box-shadow .12s, opacity .2s
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: none !important
    }

    .btn-p {
      background: var(--lav);
      color: var(--lavink);
      box-shadow: 0 4px 0 var(--lavdeep)
    }

    .btn-r {
      background: var(--rose);
      color: var(--roseink);
      box-shadow: 0 4px 0 var(--rosedeep)
    }

    .btn[disabled],
    .btn.off {
      background: var(--plum2);
      color: var(--mute);
      box-shadow: none;
      cursor: default;
      pointer-events: none
    }

    .btn-sm {
      height: 44px;
      border-radius: 14px;
      font-size: 15px;
      width: auto;
      padding: 0 18px
    }

    .glass {
      background: #ffffff12;
      border: 1px solid rgba(255, 255, 255, .1);
      -webkit-backdrop-filter: blur(22px);
      backdrop-filter: blur(22px)
    }

    .circ {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cream);
      flex: none;
      padding: 0
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 30px;
      padding: 0 13px;
      border-radius: 15px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .03em;
      white-space: nowrap
    }

    .chip-lav {
      background: var(--lav);
      color: var(--lavink)
    }

    .chip-rose {
      background: var(--rose);
      color: var(--roseink)
    }

    .chip-mint {
      background: #7cf0c829;
      color: var(--mint)
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor
    }

    .av {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-weight: 800;
      color: #1b1030;
      flex: none;
      position: relative
    }

    .av.dead:after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #170f248c url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'><path d='M19 19l22 22M41 19 19 41' stroke='%23FF5E8A' stroke-width='5' stroke-linecap='round'/></svg>") center/100% no-repeat
    }

    .mode {
      display: flex;
      gap: 14px;
      padding: 20px;
      border-radius: 28px;
      text-align: left;
      border: 0;
      width: 100%;
      transition: transform .2s cubic-bezier(.2, .8, .2, 1)
    }

    .mode:hover {
      transform: translateY(-3px)
    }

    .mode:active {
      transform: scale(.98)
    }

    .mode .t {
      font-family: var(--disp);
      letter-spacing: -.025em;
      font-size: 27px;
      font-weight: 700;
      line-height: 1.05
    }

    .mode .p {
      font-size: 14.5px;
      line-height: 1.35;
      opacity: .85
    }

    .mode .chip {
      height: 26px;
      font-size: 11.5px;
      padding: 0 10px
    }

    .tabbar {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      height: 62px;
      padding: 0 10px;
      display: flex;
      background: #241a38c7;
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid var(--line);
      border-radius: 31px;
      box-shadow: 0 10px 30px #00000059;
      z-index: 5
    }

    .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border: 0;
      background: none;
      font-size: 11px;
      font-weight: 600;
      color: var(--mute);
      padding-top: 10px
    }

    .tab.on {
      color: var(--lav)
    }

    .field {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 56px;
      padding: 0 8px 0 18px;
      border-radius: 20px
    }

    .field input {
      flex: 1;
      min-width: 0;
      background: none;
      border: 0;
      outline: 0;
      color: var(--cream);
      font-size: 17px
    }

    .field input::placeholder {
      color: #8f82ab
    }

    .field:focus-within {
      border-color: var(--lav)
    }

    .field .go {
      height: 40px;
      padding: 0 18px;
      border: 0;
      border-radius: 14px;
      background: var(--cream);
      color: var(--lavink);
      font-size: 15px;
      font-weight: 700
    }

    .code-in {
      letter-spacing: .3em;
      text-transform: uppercase;
      font-weight: 800
    }

    .list {
      border-radius: 24px;
      overflow: hidden
    }

    .li {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 58px;
      padding: 0 14px 0 16px;
      border-bottom: 1px solid var(--line)
    }

    .li:last-child {
      border-bottom: 0
    }

    .li .nm {
      flex: 1;
      min-width: 0;
      font-size: 18px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .xbtn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 0;
      background: #ffffff14;
      color: var(--mute);
      display: flex;
      align-items: center;
      justify-content: center
    }

    .xbtn:hover {
      background: #ff5e8a40;
      color: #ff8fb0
    }

    .li.in {
      animation: rowin .35s cubic-bezier(.2, .8, .2, 1)
    }

    @keyframes rowin {
      0% {
        opacity: 0;
        transform: translate(-14px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .stage {
      position: relative;
      flex: 1;
      min-height: 360px;
      max-height: 540px;
      margin-top: 14px
    }

    .stage .back {
      position: absolute;
      inset: 0;
      border-radius: 36px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform: scale(.94);
      transition: transform .5s cubic-bezier(.2, .9, .25, 1)
    }

    .stage.revealed .back {
      transform: scale(1)
    }

    .role-innocent {
      background: var(--mint);
      color: var(--mintink)
    }

    .role-murderer {
      background: var(--rose);
      color: var(--roseink)
    }

    .back .art {
      display: flex;
      justify-content: center;
      padding-top: 20px
    }

    .back .rw {
      font-family: var(--disp);
      letter-spacing: -.025em;
      font-size: clamp(44px, 15vw, 60px);
      line-height: .95;
      font-weight: 800
    }

    .front {
      position: absolute;
      inset: 0;
      border-radius: 36px;
      background: var(--lav);
      border: 3px solid var(--lavink);
      box-shadow: 0 24px 50px #00000073;
      color: var(--lavink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 0 0 26px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
      transition: transform .55s cubic-bezier(.2, .9, .25, 1), opacity .35s
    }

    .front.drag {
      transition: none;
      cursor: grabbing
    }

    .stage.revealed .front {
      transform: translateY(-125%);
      opacity: 0;
      pointer-events: none
    }

    .front .who {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--disp);
      letter-spacing: -.025em;
      font-size: clamp(40px, 14vw, 60px);
      font-weight: 800;
      padding: 0 16px;
      text-align: center;
      word-break: break-word
    }

    .front .rv {
      border: 0;
      background: none;
      color: #4b2e9e;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 19px;
      font-weight: 500;
      animation: nudge 1.4s ease-in-out infinite
    }

    @keyframes nudge {

      0%,
      to {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-8px)
      }
    }

    .dealfoot {
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 18px
    }

    .dealfoot .hint {
      margin: 0;
      text-align: center;
      font-size: 16px;
      line-height: 1.4;
      color: var(--mute);
      max-width: 280px
    }

    .dealfoot .after,
    .screen.is-revealed .dealfoot .hint {
      display: none
    }

    .screen.is-revealed .dealfoot .after {
      display: flex;
      animation: pop .4s cubic-bezier(.2, .8, .2, 1)
    }

    @keyframes pop {
      0% {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .grid2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px
    }

    .sus {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 122px;
      border-radius: 26px;
      color: var(--cream);
      background: #ffffff0f;
      border: 2px solid rgba(255, 255, 255, .1);
      font-size: 18px;
      font-weight: 700;
      transition: transform .2s cubic-bezier(.2, .8, .2, 1), background .2s, border-color .2s
    }

    .sus:active {
      transform: scale(.96)
    }

    .sus.on {
      background: #b7a4ff33;
      border-color: var(--lav)
    }

    .sus .tick {
      position: absolute;
      right: 10px;
      top: 10px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--lav);
      display: none;
      align-items: center;
      justify-content: center
    }

    .sus.on .tick {
      display: flex;
      animation: badge .3s cubic-bezier(.3, 1.6, .5, 1)
    }

    @keyframes badge {
      0% {
        transform: scale(0)
      }

      to {
        transform: scale(1)
      }
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      height: 58px;
      padding: 0 16px;
      border: 0;
      border-bottom: 1px solid var(--line);
      color: var(--cream);
      text-align: left;
      background: transparent;
      transition: background .2s
    }

    .opt:last-child {
      border-bottom: 0
    }

    .opt .nm {
      flex: 1;
      font-size: 18px;
      font-weight: 600
    }

    .opt .rd {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, .28);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s
    }

    .opt .rd svg {
      opacity: 0
    }

    .opt.on {
      background: #ff5e8a29
    }

    .opt.on .rd {
      border-color: var(--rose);
      background: var(--rose)
    }

    .opt.on .rd svg {
      opacity: 1
    }

    .note {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-radius: 20px;
      font-size: 14px;
      line-height: 1.35;
      color: #cfc4e6
    }

    .lockrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap
    }

    .lockrow .av {
      width: 34px;
      height: 34px;
      font-size: 14px;
      opacity: .35;
      transition: all .3s
    }

    .lockrow .av.done {
      opacity: 1;
      box-shadow: 0 0 0 3px var(--mint)
    }

    .codecard {
      padding: 20px 22px;
      border-radius: 30px;
      background: var(--peach);
      color: #4a1d0a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px
    }

    .codecard .c {
      font-family: var(--disp);
      font-size: clamp(38px, 12.5vw, 50px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: .06em;
      margin-top: 2px
    }

    .codecard .b {
      height: 36px;
      padding: 0 14px;
      white-space: nowrap;
      border: 0;
      border-radius: 13px;
      background: #4a1d0a;
      color: #ffe2d0;
      font-size: 14px;
      font-weight: 700
    }

    .codecard .b.l {
      background: #4a1d0a24;
      color: #4a1d0a
    }

    .pgrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px 10px
    }

    .pcell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-size: 14px;
      font-weight: 600
    }

    .pcell span.n {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .pcell .st {
      position: absolute;
      right: -1px;
      bottom: -1px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 3px solid #1E1430;
      background: var(--mint)
    }

    .pcell .st.off {
      background: #6b5c88
    }

    .pcell .crown {
      position: absolute;
      left: 50%;
      margin-left: -11px;
      top: -14px;
      animation: bob 2.4s ease-in-out infinite
    }

    @keyframes bob {

      0%,
      to {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-3px)
      }
    }

    .set {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      font-size: 16px
    }

    .set:last-child {
      border-bottom: 0
    }

    .step {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 0;
      background: #ffffff1a;
      color: var(--cream);
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .switch {
      width: 51px;
      height: 31px;
      border-radius: 16px;
      background: #ffffff2e;
      position: relative;
      border: 0;
      transition: background .2s
    }

    .switch:after {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 4px #00000040;
      transition: transform .2s
    }

    .switch.on {
      background: var(--mint)
    }

    .switch.on:after {
      transform: translate(20px)
    }

    .scene {
      position: absolute;
      inset: 0;
      animation: shake 5s infinite
    }

    .eyew {
      position: absolute;
      left: 50%;
      margin-left: -110px;
      top: 120px;
      width: 220px;
      height: 220px
    }

    .eye {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: #fff3f6;
      overflow: hidden;
      box-shadow: 0 0 70px #ff5e8a73
    }

    .pupil {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 96px;
      height: 96px;
      margin: -48px 0 0 -48px;
      border-radius: 50%;
      background: var(--ink);
